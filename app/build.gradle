apply plugin: 'com.android.application'

android {
    namespace 'com.amalulla.mini'
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.amalulla.mini"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}
